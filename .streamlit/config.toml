# Smart Camera Line Monitor - dashboard look & feel
#
# Industrial HMI style (ISA-101): neutral steel greys for
# normal operation, colour reserved for alarms and status.

[server]
# Serves ./static (bundled IBM Plex Sans font, works offline)
enableStaticServing = true

[browser]
# No usage statistics sent (works on offline factory networks)
gatherUsageStats = false

[client]
# Hide developer menu items and the Deploy button
toolbarMode = "viewer"

[theme]
base = "light"
primaryColor = "#2f5f94"
backgroundColor = "#e8ebee"
secondaryBackgroundColor = "#f1f3f5"
textColor = "#1b2229"
borderColor = "#c8ced5"
showWidgetBorder = true
baseRadius = "4px"
font = "IBM Plex Sans, system-ui, Segoe UI, sans-serif"
headingFontWeights = 600
redColor = "#d03b3b"
greenColor = "#1d6b2b"
dataframeHeaderBackgroundColor = "#eef1f4"
dataframeBorderColor = "#dfe3e8"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/ibm-plex-sans-latin-400-normal.woff2"
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/ibm-plex-sans-latin-500-normal.woff2"
weight = 500
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/ibm-plex-sans-latin-600-normal.woff2"
weight = 600
style = "normal"

[theme.sidebar]
backgroundColor = "#dde2e7"
secondaryBackgroundColor = "#f4f6f8"
borderColor = "#c3c9d0"
